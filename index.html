<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mando Center</title><style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:12px}h1{text-align:center;color:#38bdf8}.card{background:#1e293b;padding:14px;border-radius:14px;margin:12px 0}input,select,button{width:100%;padding:13px;margin:5px 0;border-radius:10px;border:none}button{background:#38bdf8;font-weight:bold}table{width:100%;background:#1e293b;border-radius:10px}th,td{padding:10px;border-bottom:1px solid #334155;text-align:center}</style></head><body><h1>🧠 Mando Center - بدون نت</h1><div class="card"><input id="name" placeholder="اسم الطالب"><input id="phone" placeholder="رقم ولي الامر"><select id="group"><option>A</option><option>B</option><option>C</option></select><button onclick="add()">حفظ ✅</button></div><div class="card"><h3>الطلاب (<span id="count">0</span>)</h3><table id="list"></table></div><script>let s=JSON.parse(localStorage.getItem('mando')||'[]');function render(){document.getElementById('count').innerText=s.length;let h='<tr><th>الاسم</th><th>المجموعة</th><th>X</th></tr>';s.forEach((x,i)=>{h+=`<tr><td>${x.name}</td><td>${x.group}</td><td><button onclick="del(${i})">حذف</button></td></tr>`});document.getElementById('list').innerHTML=h;localStorage.setItem('mando',JSON.stringify(s))}function add(){let n=document.getElementById('name').value;if(!n)return alert('اكتب الاسم');s.push({name:n,phone:document.getElementById('phone').value,group:document.getElementById('group').value});render();document.getElementById('name').value='';}function del(i){s.splice(i,1);render()}render();</script></body></html>
