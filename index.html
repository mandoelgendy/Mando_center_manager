<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mando Center</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;padding:12px;max-width:650px;margin:auto}
h1{text-align:center;color:#38bdf8}
.card{background:#1e293b;padding:14px;border-radius:14px;margin:12px 0}
input,button{width:100%;padding:12px;margin:4px 0;border-radius:10px;border:none;box-sizing:border-box}
button{background:#38bdf8;font-weight:bold;cursor:pointer}
button.pay{background:#22c55e;color:#fff;padding:8px;font-size:12px}
button.unpay{background:#f59e0b;color:#fff;padding:8px;font-size:12px}
button.del{background:#ef4444;color:#fff;padding:6px;width:auto;font-size:11px}
button.group-btn{background:#334155;color:#fff;padding:9px 14px;margin:3px;width:auto;border-radius:20px;display:inline-block}
button.group-btn.active{background:#38bdf8;color:#000}
button.hist{background:#8b5cf6;color:#fff;padding:6px;width:auto;font-size:11px}
table{width:100%;background:#1e293b;border-radius:10px;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #334155;text-align:center;font-size:13px}
.stats{display:flex;gap:8px}.stat{flex:1;background:#1e293b;padding:10px;border-radius:12px;text-align:center}.stat b{display:block;font-size:18px}
.groups-bar{overflow-x:auto;white-space:nowrap;padding:8px 0}
.due{background:#f59e0b20;border:1px solid #f59e0b;color:#fbbf24;padding:8px;border-radius:10px;text-align:center;font-size:13px;margin-bottom:8px}
</style></head><body>
<h1>🧠 Mando Center</h1>

<div id="dueBox" class="due"></div>

<div class="card">
<div style="display:flex;gap:6px"><input id="newGroupName" placeholder="اسم مجموعة جديد" style="flex:1"><button onclick="addGroup()" style="width:80px;background:#8b5cf6;color:#fff">إضافة</button></div>
<div class="groups-bar" id="groupsBar"></div>
<div id="currentInfo" style="font-size:12px;margin-top:6px"></div>
</div>

<div class="stats">
<div class="stat"><b id="count">0</b><small>الطلاب</small></div>
<div class="stat"><b id="paidCount" style="color:#22c55e">0</b><small>دفع الشهر ده</small></div>
<div class="stat"><b id="unpaidCount" style="color:#ef4444">0</b><small>باقي</small></div>
</div>

<div class="card">
<input id="name" placeholder="اسم الطالب"><input id="phone" placeholder="رقم ولي الامر"><input id="amount" type="number" placeholder="المبلغ 200">
<button onclick="addStudent()">حفظ في المجموعة دي ✅</button>
</div>

<div class="card"><table id="list"></table></div>
<div class="card" id="historyCard" style="display:none"><h3 style="margin:0 0 8px">📜 سجل الدفعات - <span id="histName"></span></h3><div id="histList" style="font-size:13px"></div><button onclick="closeHist()" style="background:#334155;color:#fff;margin-top:8px">إغلاق</button></div>

<script>
let groups = JSON.parse(localStorage.getItem('mando_groups')||'["A","B","C"]');
let s = JSON.parse(localStorage.getItem('mando')||'[]');
let currentGroup = localStorage.getItem('mando_current_group') || groups[0] || 'A';
let lastRenew = localStorage.getItem('mando_last_renew') || '';

// ترقية البيانات القديمة + اضافة تاريخ
s = s.map(x=>({
  paid:false,amount:200,paidDate:null,history:[],lastPaidMonth:'',group:'A',...x,
  history: x.history|| (x.paidDate? [{date:x.paidDate, amount:x.amount, month:x.lastPaidMonth||'قديم'}] : [])
}));
groups=[...new Set(groups)];

function save(){localStorage.setItem('mando_groups',JSON.stringify(groups));localStorage.setItem('mando',JSON.stringify(s));localStorage.setItem('mando_current_group',currentGroup);if(lastRenew)localStorage.setItem('mando_last_renew',lastRenew);}

// === التجديد كل يوم 20 ===
function checkRenewal(){
  let now = new Date();
  let today = now.getDate();
  let monthKey = now.getFullYear()+'-'+(now.getMonth()+1);

  // نحسب ميعاد التجديد الجاي
  let nextDue = new Date(now.getFullYear(), now.getMonth(), 20);
  if(today >= 20) nextDue = new Date(now.getFullYear(), now.getMonth()+1, 20);
  document.getElementById('dueBox').innerHTML = `⏰ التجديد الجاي: يوم <b>20</b> - ${nextDue.toLocaleDateString('ar-EG')} - اللي مدفعش هيرجع "لم يدفع" أوتوماتيك`;

  // لو النهاردة يوم 20 أو بعده ولسه مجددناش الشهر ده
  if(today >= 20 && lastRenew!== monthKey){
    // نجدد كل الطلاب اللي مدفعوش الشهر ده
    s.forEach(st=>{
      if(st.lastPaidMonth!== monthKey){
        st.paid = false;
        st.paidDate = null;
      }
    });
    lastRenew = monthKey;
    save();
    alert('🔄 تم تجديد شهر جديد! يوم 20 جه، كل اللي مدفعش رجع "لم يدفع"');
  }
}

function renderGroups(){let h='';groups.forEach(g=>{h+=`<button class="group-btn ${g===currentGroup?'active':''}" onclick="selectGroup('${g.replace(/'/g,"\\'")}')">${g}</button>`;});document.getElementById('groupsBar').innerHTML=h;document.getElementById('currentInfo').innerHTML=`الحالية: <b style="color:#38bdf8">${currentGroup}</b> <button class="del" onclick="deleteGroup()" style="margin-right:8px">حذف</button>`;}
function selectGroup(g){currentGroup=g;save();render();}
function addGroup(){let n=document.getElementById('newGroupName').value.trim();if(!n)return alert('اكتب اسم');if(groups.includes(n))return alert('موجودة');groups.push(n);currentGroup=n;document.getElementById('newGroupName').value='';save();render();}
function deleteGroup(){if(!confirm('تحذف '+currentGroup+' وطلابها؟'))return;s=s.filter(x=>x.group!==currentGroup);groups=groups.filter(g=>g!==currentGroup);currentGroup=groups[0]||'';if(!groups.length){groups=['A'];currentGroup='A';}save();render();}
function render(){checkRenewal();renderGroups();let f=s.filter(x=>x.group===currentGroup);document.getElementById('count').innerText=f.length;document.getElementById('paidCount').innerText=f.filter(x=>x.paid).length;document.getElementById('unpaidCount').innerText=f.length-f.filter(x=>x.paid).length;let h='<tr><th>الاسم</th><th>الدفع</th><th>السجل</th><th>X</th></tr>';f.forEach(x=>{let i=s.indexOf(x);let btn=x.paid?`<button class="pay" onclick="toggle(${i})">تم ✅<br><small>${x.paidDate||''}</small></button>`:`<button class="unpay" onclick="toggle(${i})">لم يدفع<br><small>${x.amount}ج</small></button>`;h+=`<tr><td>${x.name}<br><small style="color:#94a3b8">${x.phone||''}</small></td><td>${btn}</td><td><button class="hist" onclick="showHist(${i})">📜</button></td><td><button class="del" onclick="del(${i})">حذف</button></td></tr>`;});document.getElementById('list').innerHTML=h||'<tr><td colspan=4>مفيش طلاب لسه</td></tr>';save();}
function addStudent(){let n=document.getElementById('name').value.trim();if(!n)return alert('اسم الطالب');if(!currentGroup)return alert('اختار مجموعة');let amt=document.getElementById('amount').value||200;s.push({name:n,phone:document.getElementById('phone').value,group:currentGroup,amount:amt,paid:false,paidDate:null,history:[],lastPaidMonth:''});document.getElementById('name').value='';document.getElementById('phone').value='';document.getElementById('amount').value='';render();}
function toggle(i){
  let now = new Date();
  let monthKey = now.getFullYear()+'-'+(now.getMonth()+1);
  let fullDate = now.toLocaleString('ar-EG');
  if(!s[i].paid){
    s[i].paid=true;
    s[i].paidDate=fullDate;
    s[i].lastPaidMonth=monthKey;
    s[i].history = s[i].history||[];
    s[i].history.unshift({date:fullDate, amount:s[i].amount, month:monthKey});
  }else{
    s[i].paid=false;
    s[i].paidDate=null;
    s[i].lastPaidMonth='';
  }
  render();
}
function del(i){if(confirm('تحذف '+s[i].name+'؟')){s.splice(i,1);render();}}
function showHist(i){
  let st=s[i];
  document.getElementById('histName').innerText=st.name;
  let html='';
  if(!st.history||!st.history.length) html='<small>مفيش دفعات قديمة</small>';
  else st.history.forEach(h=>{html+=`<div style="border-bottom:1px solid #334155;padding:6px 0">✅ ${h.date} - ${h.amount}ج - شهر ${h.month}</div>`;});
  document.getElementById('histList').innerHTML=html;
  document.getElementById('historyCard').style.display='block';
  window.scrollTo(0, document.getElementById('historyCard').offsetTop);
}
function closeHist(){document.getElementById('historyCard').style.display='none';}
render();
</script></body></html>
